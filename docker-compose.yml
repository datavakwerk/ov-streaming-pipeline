# Full local stack (PRD N6: zero cloud cost). `make up` wraps `docker compose up --wait`.
#
# Ports on the host:
#   8501  dashboard (Streamlit)      3000  Grafana          9090  Prometheus
#   8080  Redpanda Console           9011  MinIO console    5433  Postgres
#   19092 Kafka API (from the host)  9010  MinIO S3 API
# Host ports are overridable in .env (POSTGRES_HOST_PORT, MINIO_API_PORT, MINIO_CONSOLE_PORT)
# because 5432/9000/9001 are popular with other local projects.

name: ov-streaming-pipeline

x-python-service: &python-service
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # ------------------------------------------------------------------ backbone
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --reserve-memory 0M
      - --node-id 0
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    entrypoint: ["/bin/bash", "/init/create_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - ./infra/init/create_topics.sh:/init/create_topics.sh:ro
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:v3.1.3
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ov}
      POSTGRES_DB: ${POSTGRES_DB:-ov}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ov} -d ${POSTGRES_DB:-ov}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET} &&
        echo bucket $${MINIO_BUCKET} ready
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-raw-events}
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  # ------------------------------------------------------------------ services
  # producer, archiver, gtfs-static, processor, dashboard: added in commits 5-10.

  # ------------------------------------------------------------------ observability
  # prometheus, grafana: added in ops phase (post commit 10).

volumes:
  redpanda-data:
  postgres-data:
  minio-data:
