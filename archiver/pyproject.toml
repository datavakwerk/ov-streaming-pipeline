[project]
name = "ov-archiver"
version = "0.1.0"
description = "Archives raw Kafka messages to MinIO, partitioned by topic/date/hour, for replay"
requires-python = ">=3.12"
dependencies = [
    "ov-common",
    "confluent-kafka>=2.5",
    "boto3>=1.35",
    "prometheus-client>=0.21",
]

[project.scripts]
ov-archiver = "archiver.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archiver"]
