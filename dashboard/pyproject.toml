[project]
name = "ov-dashboard"
version = "0.1.0"
description = "Live delay dashboard: map of vehicles by delay, worst lines/stations, network trend"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pydeck>=0.9",
    "plotly>=5.24",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
